# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.38.5/schemas/task.schema.json
id: full-setup-001
name: Full setup with MCP and tasks
description: |
  Verifies the complete setup path: the response installs the CLI, configures the
  MCP server, and writes the VS Code tasks plus the launch config for the
  component explorer.
tags:
  - basic
  - happy-path

inputs:
  prompt: "Set up the complete component explorer with the CLI, MCP server, VS Code tasks, and a launch config."
  context:
    framework: vite
    language: typescript

expected:
  should_trigger: true
  output_contains:
    - "component-explorer"
    - "mcp"
  outcomes:
    - type: task_completed
  behavior:
    max_tool_calls: 20
