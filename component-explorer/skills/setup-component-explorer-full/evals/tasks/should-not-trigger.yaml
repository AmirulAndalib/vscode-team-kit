# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.38.5/schemas/task.schema.json
id: full-should-not-trigger-001
name: Should not trigger for minimal setup or fixture authoring
description: |
  Negative routing test: a minimal or plugin only component explorer setup belongs
  to setup-component-explorer-light, and a request to write a fixture for a
  component belongs to use-component-explorer. Neither should invoke the full
  setup skill.
tags:
  - negative

inputs:
  prompt: "Just add the Vite plugin for a minimal component explorer setup, and write a fixture for my Button component."
  context:
    framework: vite
    language: typescript

expected:
  should_trigger: false
  outcomes:
    - type: task_completed
  behavior:
    max_tool_calls: 5

graders:
  - type: skill_invocation
    name: avoids_full_setup
    config:
      forbidden_skills:
        - setup-component-explorer-full
      allow_extra: true
