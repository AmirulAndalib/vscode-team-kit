# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.38.5/schemas/eval.schema.json
schemaVersion: "1.2"
name: setup-component-explorer-full-eval
description: |
  Evaluation suite for the setup-component-explorer-full skill.
  Tests the full setup including CLI, MCP server, VS Code tasks
  and launch configuration.
skill: setup-component-explorer-full
version: "1.0"

config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-4.6
  skill_directories:
    - ".."
    - "../.."
  required_skills:
    - setup-component-explorer-full

metrics:
  - name: trigger_accuracy
    weight: 1.0
    threshold: 0.9
    description: Correctly distinguish full Component Explorer setup from lightweight setup and usage.

graders:
  - type: text
    name: no_errors
    config:
      regex_not_match:
        - "(?i)fatal error|crashed|exception occurred"

  - type: code
    name: has_output
    config:
      assertions:
        - "len(output) > 10"

tasks:
  - "tasks/*.yaml"
