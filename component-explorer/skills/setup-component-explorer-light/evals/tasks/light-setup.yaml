# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.38.5/schemas/task.schema.json
id: light-setup-001
name: Lightweight setup with AI agent integration
description: |
  Verifies the lightweight path: the response installs the Component Explorer
  packages, adds the Vite plugin, and wires the MCP server for AI agent
  integration without pulling in the CLI daemon.
tags:
  - basic
  - happy-path

inputs:
  prompt: "Add a minimal, lightweight Component Explorer setup to my Vite project without the CLI daemon: install the packages, add the Vite plugin, and configure the MCP server for AI agent integration."
  context:
    framework: vite
    language: typescript

expected:
  should_trigger: true
  output_contains:
    - "component-explorer"
    - "vite"
    - "MCP"
  outcomes:
    - type: task_completed
  behavior:
    max_tool_calls: 10
