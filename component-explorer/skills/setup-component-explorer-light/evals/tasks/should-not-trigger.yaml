# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.38.5/schemas/task.schema.json
id: light-should-not-trigger-001
name: Should not trigger for full setup or fixture authoring
description: |
  Negative routing test: a full setup with VS Code tasks and launch config belongs
  to setup-component-explorer-full, and a request to write a fixture for a
  component belongs to use-component-explorer. Neither should invoke the
  lightweight setup skill.
tags:
  - negative

inputs:
  prompt: "Do the full setup of the component explorer with the CLI daemon, VS Code tasks and launch config, and write a fixture for my Button component."
  context:
    framework: vite
    language: typescript

expected:
  should_trigger: false
  outcomes:
    - type: task_completed
  behavior:
    max_tool_calls: 5

graders:
  - type: skill_invocation
    name: avoids_light_setup
    config:
      forbidden_skills:
        - setup-component-explorer-light
      allow_extra: true
