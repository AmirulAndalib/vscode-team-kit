# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.38.5/schemas/task.schema.json
id: setup-should-not-trigger-001
name: Should not trigger for fixture authoring
description: |
  Negative routing test: a request to write a fixture for a component belongs to
  use-component-explorer, and a request to set up a different test framework is
  unrelated tooling. Neither should invoke the setup skill.
tags:
  - negative

inputs:
  prompt: "Write a fixture for my Button component, then set up Jest as a different test framework for unit tests."
  context:
    framework: vite
    language: typescript

expected:
  should_trigger: false
  outcomes:
    - type: task_completed
  behavior:
    max_tool_calls: 5

graders:
  - type: skill_invocation
    name: avoids_setup_component_explorer
    config:
      forbidden_skills:
        - setup-component-explorer
      allow_extra: true
