# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.38.5/schemas/task.schema.json
id: use-should-not-trigger-001
name: Should not trigger for setup or unit tests
description: |
  Negative routing test: a request to set up or install the component explorer
  belongs to the setup skills, and a request to write a unit test with a test
  runner is unrelated to fixtures. Neither should invoke the fixture authoring
  skill.
tags:
  - negative

inputs:
  prompt: "Install and set up the component explorer in this repo, then write a unit test with the Jest test runner."
  context:
    framework: vite
    language: typescript

expected:
  should_trigger: false
  outcomes:
    - type: task_completed
  behavior:
    max_tool_calls: 5

graders:
  - type: skill_invocation
    name: avoids_fixture_authoring
    config:
      forbidden_skills:
        - use-component-explorer
      allow_extra: true
