# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.38.5/schemas/task.schema.json
id: create-fixture-001
name: Create a basic component fixture
description: |
  Verifies fixture authoring when adding or changing UI in a component explorer
  project: the response must write a valid fixture with defineFixture and a render
  function, and update or add variants so the component can be used for
  screenshots and visual testing work.
tags:
  - basic
  - happy-path

inputs:
  prompt: "This project uses Component Explorer. I am adding a Button UI component — create a fixture with variants so it shows up for screenshots and visual testing."
  context:
    language: typescript
    framework: react

expected:
  should_trigger: true
  output_contains:
    - "fixture"
  outcomes:
    - type: task_completed
  behavior:
    max_tool_calls: 10
