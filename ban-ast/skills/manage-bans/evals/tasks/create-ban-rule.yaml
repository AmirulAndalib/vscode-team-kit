# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.38.5/schemas/task.schema.json
id: create-ban-rule-001
name: Create a ban rule for console.log
description: |
  Verifies the skill creates and manages a banned AST pattern for the requested
  code construct: a tree-sitter lint rule written to BANNED_AST.md that prevents
  the specific syntax from appearing in edits, plus a validation step for the rule.
tags:
  - basic
  - happy-path

inputs:
  prompt: "Ban console.log in this project: add a tree-sitter lint rule to BANNED_AST.md that prevents that syntax in edits, then validate the rule."
  context:
    language: typescript

expected:
  should_trigger: true
  output_contains:
    - "ban"
  outcomes:
    - type: task_completed
  behavior:
    max_tool_calls: 10
