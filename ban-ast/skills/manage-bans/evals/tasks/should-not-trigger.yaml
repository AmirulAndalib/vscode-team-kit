# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.38.5/schemas/task.schema.json
id: should-not-trigger-001
name: Should not trigger for general code questions
description: |
  Negative routing test: a request to explain how existing code works is a
  general programming question and must not invoke manage-bans or create a
  ban rule.
tags:
  - negative

inputs:
  prompt: "Explain how this sorting algorithm works"
  context:
    language: python

expected:
  should_trigger: false
  outcomes:
    - type: task_completed
  behavior:
    max_tool_calls: 5

graders:
  - type: skill_invocation
    name: avoids_manage_bans
    config:
      forbidden_skills:
        - manage-bans
      allow_extra: true
