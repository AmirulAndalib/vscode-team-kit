name: Waza Skill Evaluation

on:
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Enable verbose live-evaluation output'
        required: false
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths:
      - '**/skills/**'
      - '**/evals/**'
      - '**/.plugin/plugin.json'
      - '.waza.yaml'
      - 'marketplace.json'
      - 'scripts/*waza*.sh'
      - '.github/workflows/waza-eval.yml'

concurrency:
  group: waza-eval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate Waza Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Waza
        run: |
          scripts/install-waza.sh "${RUNNER_TEMP}/waza-bin"
          echo "${RUNNER_TEMP}/waza-bin" >> "${GITHUB_PATH}"

      - name: Validate coverage and specs
        run: scripts/validate-waza.sh

      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: waza-validation-results
          path: .waza-results/validation/
          retention-days: 30
          if-no-files-found: warn

  evaluate:
    name: Run Live Waza Evaluations
    needs: validate
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Waza
        run: |
          scripts/install-waza.sh "${RUNNER_TEMP}/waza-bin"
          echo "${RUNNER_TEMP}/waza-bin" >> "${GITHUB_PATH}"

      - name: Check live-evaluation credentials
        id: credentials
        env:
          COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        run: |
          mkdir -p .waza-results/live
          if [[ -n "${COPILOT_TOKEN}" ]]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
            {
              echo '<!-- vscode-team-kit-waza-eval -->'
              echo '# Waza evaluation'
              echo
              # shellcheck disable=SC2016
              echo 'Live-model evaluation was skipped because `COPILOT_TOKEN` is unavailable.'
              echo 'Deterministic Waza coverage and spec validation still passed.'
            } > .waza-results/live/comment.md
          fi

      - name: Run all live evaluations
        id: live
        if: steps.credentials.outputs.available == 'true'
        continue-on-error: true
        env:
          COPILOT_SDK_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          WAZA_VERBOSE: ${{ inputs.verbose || false }}
        run: scripts/run-waza-evals.sh

      - name: Write job summary
        if: always()
        env:
          HAS_CREDENTIALS: ${{ steps.credentials.outputs.available }}
          LIVE_OUTCOME: ${{ steps.live.outcome }}
        run: |
          {
            echo '## Waza live evaluation'
            echo
            if [[ "${HAS_CREDENTIALS}" != "true" ]]; then
              # shellcheck disable=SC2016
              echo 'Skipped: `COPILOT_TOKEN` was unavailable.'
            elif [[ "${LIVE_OUTCOME}" == "success" ]]; then
              echo 'All eight live suites passed.'
            else
              echo 'One or more live suites failed. Live evaluations are informational and do not block merges.'
            fi
            echo
            # shellcheck disable=SC2016
            echo 'See the `waza-live-results` artifact for per-skill JSON, transcripts, and reports.'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Update PR comment
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          body_file='.waza-results/live/comment.md'
          if [[ ! -s "${body_file}" ]]; then
            exit 0
          fi

          if [[ "$(wc -c < "${body_file}")" -gt 60000 ]]; then
            head -c 59000 "${body_file}" > "${body_file}.truncated"
            printf '\n\n_Report truncated. Download the workflow artifact for complete output._\n' >> "${body_file}.truncated"
            mv "${body_file}.truncated" "${body_file}"
          fi

          comment_id="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --jq '.[] | select(.body | contains("<!-- vscode-team-kit-waza-eval -->")) | .id' |
              head -n 1
          )"
          if [[ -n "${comment_id}" ]]; then
            jq -n --rawfile body "${body_file}" '{body: $body}' |
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" --input -
          else
            gh pr comment "${PR_NUMBER}" --body-file "${body_file}"
          fi

      - name: Upload live results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: waza-live-results
          path: .waza-results/live/
          retention-days: 30
          if-no-files-found: warn
