# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.38.5/schemas/task.schema.json
id: council-review-001
name: Multi-model council review of risky changes
description: |
  Verifies the CRITICAL multi-model council review after a non-trivial development
  phase: several models independently inspect the same risky pull request diff,
  hunt for bugs in recent edits and changes, then debate and cross-review findings
  between models before development is called done.
tags:
  - basic
  - happy-path

inputs:
  prompt: "Council review this risky pull request: have multiple models independently inspect the same change and diff, hunt for bugs in my recent edits, then debate and cross-review the findings."
  context:
    project_type: web-app

expected:
  should_trigger: true
  output_contains:
    - "review"
  outcomes:
    - type: task_completed
  behavior:
    max_tool_calls: 20
