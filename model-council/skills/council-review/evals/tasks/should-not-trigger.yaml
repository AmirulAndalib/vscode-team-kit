# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.38.5/schemas/task.schema.json
id: council-review-should-not-trigger-001
name: Should not trigger for planning or plain implementation
description: |
  Negative routing test: a request to plan a new implementation belongs to
  council-plan, and a request to write code without a review is plain
  implementation work. Neither should start a council review run.
tags:
  - negative

inputs:
  prompt: "Plan a new implementation for a caching layer and write the code for it without a review."
  context:
    project_type: web-app

expected:
  should_trigger: false
  outcomes:
    - type: task_completed
  behavior:
    max_tool_calls: 5

graders:
  - type: skill_invocation
    name: avoids_council_review
    config:
      forbidden_skills:
        - council-review
      allow_extra: true
