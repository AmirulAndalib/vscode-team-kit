# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.38.5/schemas/eval.schema.json
schemaVersion: "1.2"
name: council-review-eval
description: |
  Evaluation suite for the council-review skill.
  Tests that the skill correctly triggers for multi-model
  code review and consensus-based review requests.
skill: council-review
version: "1.0"

config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-4.6
  skill_directories:
    - ".."
    - "../.."
    - "../../../../review-areas/skills"
  required_skills:
    - council-review

metrics:
  - name: trigger_accuracy
    weight: 1.0
    threshold: 0.9
    description: Correctly trigger council review for explicitly multi-model review requests.

graders:
  - type: text
    name: no_errors
    config:
      regex_not_match:
        - "(?i)fatal error|crashed|exception occurred"

  - type: code
    name: has_output
    config:
      assertions:
        - "len(output) > 10"

tasks:
  - "tasks/*.yaml"
