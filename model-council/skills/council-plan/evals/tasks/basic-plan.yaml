# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.38.5/schemas/task.schema.json
id: council-plan-001
name: Multi-model council implementation and architecture plan
description: |
  Verifies multi-model council planning for an implementation and architecture
  decision: multiple models propose plans independently, the run offers different
  perspectives on an approach, and the orchestrator debates approaches, compares
  strategies, and cross-plans a synthesis.
tags:
  - basic
  - happy-path

inputs:
  prompt: "Plan with council how to add authentication: have multiple models independently propose implementation and architecture plans, debate approaches and compare strategies, then cross-plan a synthesis."
  context:
    project_type: web-app

expected:
  should_trigger: true
  output_contains:
    - "plan"
  outcomes:
    - type: task_completed
  behavior:
    max_tool_calls: 20

graders:
  - type: text
    name: mentions_council_perspectives
    config:
      regex_match:
        - "(?i)council|model|perspective"
