# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.38.5/schemas/task.schema.json
id: council-plan-should-not-trigger-001
name: Should not trigger for review or quick questions
description: |
  Negative routing test: a request to review a diff or pull request belongs to
  council-review, and a quick factual question should be answered directly.
  Neither should start a council planning run.
tags:
  - negative

inputs:
  prompt: "Review the diff in this pull request and answer one quick factual question: which file declares the router?"
  context:
    project_type: web-app

expected:
  should_trigger: false
  outcomes:
    - type: task_completed
  behavior:
    max_tool_calls: 5

graders:
  - type: skill_invocation
    name: avoids_council_plan
    config:
      forbidden_skills:
        - council-plan
      allow_extra: true
